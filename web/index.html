<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoairk</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="scene">
      <div class="scene-top">
        <h1 id="scene-name">Zoairk</h1>
        <span class="scene-controls">
          <button id="mute" type="button" class="mute" aria-label="Mute sound">🔊</button>
          <span id="status" class="status">connecting…</span>
        </span>
      </div>
      <p id="scene-description" class="scene-description"></p>
      <div id="player-status" class="player-status" hidden>
        <span class="hp"><span class="hp-bar"><span id="hp-fill" class="hp-fill"></span></span> <span id="hp-text"></span></span>
        <button id="inv-button" type="button" class="inv-button" aria-haspopup="dialog" aria-expanded="false">🎒 Inventory <span id="inv-count" class="inv-count">0</span></button>
      </div>
    </header>

    <section id="log" class="log" aria-live="polite"></section>

    <div id="inv-overlay" class="inv-overlay" hidden>
      <div class="inv-panel" role="dialog" aria-modal="true" aria-labelledby="inv-title">
        <div class="inv-head"><h2 id="inv-title">Inventory</h2><button id="inv-close" type="button" aria-label="Close inventory">✕</button></div>
        <ul id="inv-list" class="inv-list"></ul>
      </div>
    </div>

    <div id="thinking" class="thinking" hidden>thinking…</div>

    <form id="input-form" class="input-row" autocomplete="off">
      <span class="prompt">&gt;</span>
      <input id="input" type="text" placeholder="What do you do?" aria-label="Command" autofocus>
      <button type="submit">Send</button>
    </form>
  </main>
  <script src="effects.js"></script>
  <script src="app.js"></script>
</body>
</html>
